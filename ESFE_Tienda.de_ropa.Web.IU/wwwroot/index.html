<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claret Style - Acceso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <h1>🍷 Claret Style</h1>

        <!-- ================= SECCIÓN 1: LOGIN ================= -->
        <div id="seccionLogin">
            <p>Inicia sesión para acceder a la calculadora</p>

            <form id="formLogin">
                <div class="input-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" placeholder="Ej: admin" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" id="btnLogin">Iniciar Sesión</button>
            </form>

            <p id="mensajeErrorLogin" class="error-msg hidden">Usuario o contraseña incorrectos</p>
        </div>

        <!-- ================= SECCIÓN 2: CALCULADORA (Oculta al inicio) ================= -->
        <div id="seccionCalculadora" class="hidden">
            <p>Calculadora de promociones y descuentos</p>

            <!-- Vista previa del producto -->
            <div class="preview-box">
                <img id="imgPrenda" src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400" alt="Vista previa de prenda">
                <span id="badgeDescuento" class="badge">0% OFF</span>
            </div>

            <div class="input-group">
                <label for="precio">Precio por prenda ($):</label>
                <input type="number" id="precio" min="0" step="0.01" placeholder="Ej: 25.00">
            </div>

            <div class="input-group">
                <label for="cantidad">Cantidad de prendas:</label>
                <input type="number" id="cantidad" min="1" step="1" placeholder="Ej: 3">
            </div>

            <button id="btnCalcular">Calcular Total</button>

            <div id="contenedorResultado" class="resultado-box">
                <h2 id="totalTexto">Total: $0.00</h2>
                <p id="mensajeEstado">Ingrese datos para calcular...</p>
            </div>

            <button id="btnCerrarSesion" class="btn-secundario">Cerrar Sesión</button>
        </div>

        <!-- Sección de Redes Sociales -->
        <footer class="social-links">
            <p>Síguenos en redes sociales:</p>
            <div class="icons">
                <a href="https://instagram.com" target="_blank">Instagram</a>
                <a href="https://tiktok.com" target="_blank">TikTok</a>
                <a href="https://facebook.com" target="_blank">Facebook</a>
            </div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
