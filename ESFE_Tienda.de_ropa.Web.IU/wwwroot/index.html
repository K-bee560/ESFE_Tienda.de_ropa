<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claret Style - Calculadora de Descuentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="card">
        <h1>🍷 Claret Style</h1>
        <p>Calculadora de promociones y descuentos exclusivos</p>

        <div class="input-group">
            <label for="precio">Precio por prenda ($):</label>
            <input type="number" id="precio" min="0" step="0.01" placeholder="Ej: 25.00">
        </div>

        <div class="input-group">
            <label for="cantidad">Cantidad de prendas:</label>
            <input type="number" id="cantidad" min="1" step="1" placeholder="Ej: 3">
        </div>

        <button id="btnCalcular">Calcular Total</button>

        <div id="contenedorResultado" class="resultado-box hidden">
            <h2 id="totalTexto">Total: $0.00</h2>
            <p id="mensajeEstado">Ingrese datos para calcular...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
